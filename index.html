:root{
  --bg:#FFEEFB; --surface:#FFFFFF; --surface-2:#FBDDF5; --ink:#1F1F1F; --muted:#5E4A5A;

  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;

  color-scheme:light;

  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

    --c-expo:#F04BDC; --c-jam:#C6FF00; --c-talk:#5CC0FF; --c-party:#FF9F45;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#151217; --surface-2:#221B24; --ink:#F2EAF0; --muted:#B9A9B5;
  --magenta:#F04BDC; --magenta-ink:#FF86EC; --lime:#C6FF00; --on-accent:#000000;
  --line:rgba(255,238,251,.14); --line-strong:#F2EAF0; --dot:rgba(255,238,251,.07);
  --c-expo:#F04BDC; --c-jam:#C6FF00; --c-talk:#5CC0FF; --c-party:#FF9F45;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1.0625rem;line-height:1.6;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(var(--dot) 1.4px,transparent 1.6px);background-size:9px 9px;
  -webkit-mask-image:linear-gradient(125deg,transparent 30%,#000 75%);mask-image:linear-gradient(125deg,transparent 30%,#000 75%)}
#app{position:relative;z-index:1}
img,svg{max-width:100%}
a{color:var(--magenta-ink);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--magenta);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* pixel border: notched corners, like the posters */
.px{box-shadow:0 calc(-1*var(--pixel)) 0 0 var(--pc,var(--line-strong)),0 var(--pixel) 0 0 var(--pc,var(--line-strong)),calc(-1*var(--pixel)) 0 0 0 var(--pc,var(--line-strong)),var(--pixel) 0 0 0 var(--pc,var(--line-strong))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 8px}
.mark{display:flex;align-items:flex-end;gap:2px;text-decoration:none;color:var(--ink)}
.mark b{font-family:var(--f-mark);font-weight:900;font-size:30px;line-height:.8;letter-spacing:-.01em}
.mark svg{height:23px;width:auto;margin-bottom:1px}
.mark span{font-family:var(--f-pixel);font-size:13px;margin-left:10px;color:var(--muted);line-height:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border:0;background:var(--surface);color:var(--ink);cursor:pointer;font-family:var(--f-pixel);font-size:14px;text-decoration:none;line-height:1.1}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--magenta);color:#000}
.btn.primary:hover{filter:brightness(1.07)}
.btn.lime{background:var(--lime);color:#000}
.btn.ghost{background:transparent;box-shadow:none;text-decoration:underline;text-underline-offset:4px}
.btn.small{min-height:36px;padding:6px 12px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* hero */
.hero{position:relative;padding:28px 0 36px}
.hero h1{font-family:var(--f-pixel);font-weight:700;font-size:clamp(2.1rem,7.4vw,4.6rem);line-height:.98;margin:0 0 14px;letter-spacing:-.02em;max-width:13ch}
.hero h1 .l2{color:var(--magenta)}
.hero p.lead{max-width:46ch;margin:0;color:var(--muted);font-size:1.125rem}
.spark{position:absolute;color:var(--magenta);pointer-events:none}
.spark.a{right:4%;top:18px;width:54px}
.spark.b{right:22%;top:120px;width:22px;opacity:.8}
.spark.c{right:9%;top:170px;width:30px}
@media (max-width:640px){.spark.b,.spark.c{display:none}.spark.a{width:36px;right:2%}}

.next{margin-top:30px;display:grid;grid-template-columns:auto 1fr;gap:0;background:var(--surface);max-width:760px}
.next .when{background:var(--lime);color:#000;padding:16px 18px;font-family:var(--f-pixel);display:flex;flex-direction:column;justify-content:center;min-width:140px;text-align:center}
.next .when .d{font-size:2.1rem;line-height:1;font-weight:700}
.next .when .m{font-size:.95rem;margin-top:6px}
.next .body{padding:16px 20px;min-width:0}
.next .flag{font-family:var(--f-pixel);font-size:13px;color:var(--magenta-ink);display:flex;align-items:center;gap:8px}
.next .flag .live{width:9px;height:9px;background:var(--magenta);display:inline-block;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.next h2{font-family:var(--f-pixel);font-size:1.45rem;line-height:1.15;margin:6px 0 4px}
.next .meta{margin:0;color:var(--muted)}
.next .meta em{font-style:normal;font-weight:700;color:var(--magenta-ink)}
.next .body .btn{margin-top:12px}
@media (max-width:560px){.next{grid-template-columns:1fr}.next .when{flex-direction:row;gap:10px;align-items:baseline;justify-content:flex-start;text-align:left;padding:12px 16px}.next .when .m{margin:0}}

/* controls */
.controls{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:14px 0 12px;border-bottom:1px solid var(--line);padding-top:calc(14px + env(safe-area-inset-top,0px));margin-top:calc(-1*env(safe-area-inset-top,0px))}
.controls .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.controls .row + .row{margin-top:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 6px;scrollbar-width:none;flex:1 1 100%;margin:-4px -4px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;background:var(--surface);border:0;cursor:pointer;font-size:.95rem;white-space:nowrap;--pc:var(--line)}
.chip .sq{width:10px;height:10px;background:var(--cc);flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);--pc:var(--ink)}
.chip[aria-pressed="true"] .sq{box-shadow:0 0 0 2px var(--bg)}
.select{min-height:40px;padding:6px 36px 6px 12px;background:var(--surface);border:0;appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat;--pc:var(--line)}
.seg{display:inline-flex;background:var(--surface);--pc:var(--line)}
.seg button{min-height:40px;padding:6px 14px;border:0;background:transparent;cursor:pointer;font-family:var(--f-pixel);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--magenta);color:#000}
.check{display:inline-flex;align-items:center;gap:8px;font-size:.95rem;cursor:pointer;min-height:40px}
.check input{width:18px;height:18px;accent-color:var(--magenta)}
.spacer{flex:1}

/* list */
main{padding:24px 0 60px}
.month-h{font-family:var(--f-pixel);font-size:1.15rem;margin:34px 0 14px;display:flex;align-items:center;gap:12px;color:var(--ink)}
.month-h::after{content:"";flex:1;height:3px;background:repeating-linear-gradient(90deg,var(--magenta) 0 6px,transparent 6px 10px)}
.month-h:first-child{margin-top:4px}
.ev{display:grid;grid-template-columns:88px 1fr;gap:18px;padding:16px 18px;margin:0 0 16px;background:var(--surface);cursor:pointer;width:100%;text-align:left;border:0;color:inherit;--pc:var(--line)}
.ev:hover{--pc:var(--magenta)}
.ev.past{opacity:.62}
.ev .date{font-family:var(--f-pixel);text-align:center;border-right:3px dotted var(--line);padding-right:14px}
.ev .date .d{font-size:1.65rem;line-height:1;font-weight:700}
.ev .date .d2{font-size:1rem;line-height:1.1;margin-top:4px;color:var(--magenta-ink);font-weight:700}
.ev .date .m{font-size:.8rem;color:var(--muted);margin-top:6px}
.ev .tag{display:inline-flex;align-items:center;gap:7px;font-size:.85rem;color:var(--muted)}
.ev .tag .sq{width:10px;height:10px;background:var(--cc)}
.ev h3{font-family:var(--f-pixel);font-size:1.3rem;line-height:1.2;margin:4px 0 2px;font-weight:700}
.ev .by{margin:0;font-size:1rem}
.ev .by em{font-style:normal;color:var(--magenta-ink);font-weight:700}
.ev .where{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.badge{display:inline-block;font-family:var(--f-pixel);font-size:11px;padding:3px 7px;margin-left:8px;background:var(--magenta);color:#000;vertical-align:2px}
.badge.past{background:var(--surface-2);color:var(--muted)}
@media (max-width:520px){.ev{grid-template-columns:64px 1fr;gap:14px;padding:14px}.ev .date{padding-right:10px}.ev .date .d{font-size:1.35rem}.ev h3{font-size:1.12rem}}

.empty{padding:40px 24px;text-align:center;background:var(--surface);--pc:var(--line)}
.empty p{margin:0 0 14px;color:var(--muted)}

/* month grid */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}

.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}

.cell{min-height:104px;background:var(--surface);padding:6px;border:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;color:inherit;min-width:0}
.cell.out{background:transparent;opacity:.4;cursor:default}
.cell .n{font-family:var(--f-pixel);font-size:13px}

.cell.sel{outline:3px solid var(--magenta);outline-offset:-3px}
.cell .bar{display:block;font-size:.75rem;line-height:1.25;padding:2px 5px;background:var(--cc);color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .more{font-size:.75rem;color:var(--muted)}
.cell .dots{display:none;gap:3px;flex-wrap:wrap}
.cell .dots i{width:8px;height:8px;background:var(--cc);display:block}

.day-list{margin-top:24px}

/* footer */
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:.95rem}
footer .row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}

/* dialogs */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);max-width:min(620px,calc(100vw - 24px));width:100%;max-height:calc(100dvh - 32px);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:22px 22px 24px}
.dlg-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{min-width:44px;min-height:44px;border:0;background:var(--surface-2);cursor:pointer;font-family:var(--f-pixel);font-size:18px}
.dlg h2{font-family:var(--f-pixel);font-size:1.6rem;line-height:1.15;margin:8px 0 6px}
.facts{margin:16px 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.facts dt{font-family:var(--f-pixel);font-size:12px;color:var(--muted);padding-top:4px}
.facts dd{margin:0}
.desc{margin:0 0 18px;max-width:60ch}
.addcal{background:var(--surface-2);padding:14px;margin-top:6px}
.addcal p{margin:0 0 10px;font-family:var(--f-pixel);font-size:13px}
.addcal .btns{display:flex;flex-wrap:wrap;gap:10px}
@media (max-width:560px){
  dialog{max-width:100vw;margin:auto 0 0;max-height:92dvh}
  dialog .dlg{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
}

/* admin */
.admin-bar{position:sticky;bottom:0;z-index:6;background:var(--ink);color:var(--bg);padding:12px 0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.admin-bar .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.admin-bar .btn{--pc:transparent}
.adm h1{font-family:var(--f-pixel);font-size:1.8rem;margin:10px 0 4px}
.adm .hint{color:var(--muted);margin:0 0 20px;max-width:60ch}
.adm-row{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--surface);margin-bottom:12px;--pc:var(--line)}
.adm-row .sq{width:12px;height:12px;background:var(--cc);flex:0 0 auto}
.adm-row .t{flex:1;min-width:0}
.adm-row .t b{display:block;font-family:var(--f-pixel);font-size:1rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-row .t small{color:var(--muted);font-size:.9rem}
.adm-row .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
form.ef{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:14px}
form.ef .full{grid-column:1/-1}
form.ef label{display:flex;flex-direction:column;gap:6px;font-size:.95rem;font-weight:700}
form.ef label small{font-weight:400;color:var(--muted)}
form.ef input,form.ef select,form.ef textarea{min-height:44px;padding:8px 12px;background:var(--bg);border:2px solid var(--line);font-weight:400;width:100%}
form.ef textarea{min-height:110px;resize:vertical}
form.ef input:focus,form.ef select:focus,form.ef textarea:focus{border-color:var(--magenta);outline:none}
form.ef .cb{flex-direction:row;align-items:center;gap:10px;font-weight:400}
form.ef .cb input{width:20px;min-height:20px;accent-color:var(--magenta)}
form.ef .err{color:#d1004f;font-weight:700;margin:0}
@media (max-width:560px){form.ef{grid-template-columns:1fr}}
.pw{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.pw input{min-height:48px;padding:10px 12px;background:var(--bg);border:2px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;z-index:50;font-size:.95rem;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 ]

<script>
(function(){
"use strict";
/* ---------- capture the page source before anything changes ---------- */
var SCRIPT_HTML = document.currentScript ? document.currentScript.outerHTML : "";

var DATA;
try { DATA = JSON.parse(document.getElementById("afk-data").textContent); } catch(e){ DATA = {updatedAt:"", events:[]}; }
if (!Array.isArray(DATA.events)) DATA.events = [];
/* true when the page is hosted as its own site (GitHub Pages), false inside the claude.ai viewer or opened as a file */
var STANDALONE = /^https?:$/.test(location.protocol) && !/claude|anthropic/i.test(location.hostname);

var PW_HASH = "991ad442b7bfb7a693c61a1c47ff5b5b6658260f11e313c2160287a323fee124"; /* replaced at build time */

var CATS = {

var MONTHS = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
var MON3 = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
var DOW = ["lun","mar","mer","gio","ven","sab","dom"];

var app = document.getElementById("app");
var ui = { view:"list", cats:[], city:"", past:false, cursor:null, selDay:null, mode:"public" };

var draft = null; /* admin working copy */

/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pad(n){ return (n<10?"0":"")+n; }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parse(s){ var p = String(s||"").split("-"); return new Date(+p[0], (+p[1]||1)-1, +p[2]||1); }
function today(){ return ymd(new Date()); }
function endOf(e){ return e.end && e.end >= e.start ? e.end : e.start; }
function status(e){ var t = today(); if (endOf(e) < t) return "past"; if (e.start <= t) return "live"; return "next"; }
function sortEv(a,b){ return a.start < b.start ? -1 : a.start > b.start ? 1 : (a.title||"").localeCompare(b.title||""); }
function store(k,v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){} }
function load(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function sstore(k,v){ try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch(e){} }
function sload(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }

function dayNums(e){
  var s = parse(e.start), en = parse(endOf(e));
  if (e.start === endOf(e)) return {d: pad(s.getDate()), d1: pad(s.getDate()), d2: "", m: MON3[s.getMonth()]};
  var m = s.getMonth() === en.getMonth() ? MON3[s.getMonth()] : MON3[s.getMonth()]+"–"+MON3[en.getMonth()];
  return {d: pad(s.getDate())+"–"+pad(en.getDate()), d1: pad(s.getDate()), d2: "–"+pad(en.getDate()), m: m};
}
function rangeText(e){
  var s = parse(e.start), en = parse(endOf(e));
  var t;
  if (e.start === endOf(e)) t = s.getDate()+" "+MONTHS[s.getMonth()]+" "+s.getFullYear();
  else if (s.getMonth() === en.getMonth() && s.getFullYear() === en.getFullYear()) t = s.getDate()+"–"+en.getDate()+" "+MONTHS[s.getMonth()]+" "+s.getFullYear();
  else t = s.getDate()+" "+MONTHS[s.getMonth()]+" – "+en.getDate()+" "+MONTHS[en.getMonth()]+" "+en.getFullYear();
  return t;
}
function timeText(e){
  if (e.timeStart && e.timeEnd) return "dalle "+e.timeStart+" alle "+e.timeEnd;

}
function catOf(e){ return CATS[e.category] || CATS.expo; }
function byLine(e){
  var parts = [];

function whereLine(e){ return [e.venue, e.city].filter(Boolean).map(esc).join(", "); }

function kSvg(stemColor, accent){

}
var SPARK = '<svg viewBox="0 0 9 9" shape-rendering="crispEdges" aria-hidden="true"><g fill="currentColor"><rect x="4" width="1" height="9"/><rect y="4" width="9" height="1"/><rect x="3" y="3" width="3" height="3"/><rect x="1" y="1" width="1" height="1"/><rect x="7" y="1" width="1" height="1"/><rect x="1" y="7" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/></g></svg>';

function toast(msg){

/* ---------- filtering ---------- */
function visibleEvents(){
  var t = today();
  return DATA.events.slice().sort(sortEv).filter(function(e){
    if (!ui.past && endOf(e) < t) return false;
    if (ui.cats.length && ui.cats.indexOf(e.category) < 0) return false;

}
function cityOptions(){

  var used = {}; DATA.events.forEach(function(e){ if (e.city) used[e.city] = 1; });
  /* cities with events first, then the rest of Sicily */
  return Object.keys(set).sort(function(a,b){ return (used[b]?1:0)-(used[a]?1:0) || a.localeCompare(b); }).map(function(c){ return {name:c, has:!!used[c]}; });
}

/* ---------- render: public ---------- */
function render(){

    var st = status(featured), dn = dayNums(featured);

    h += '</div></div>';

  Object.keys(CATS).forEach(function(k){
    h += '<button class="chip px" type="button" data-cat="'+k+'" aria-pressed="'+(ui.cats.indexOf(k)>=0)+'" style="--cc:'+CATS[k].color+'"><i class="sq" aria-hidden="true"></i>'+esc(CATS[k].label)+'</button>';
  });
  h += '</div></div>';
  h += '<div class="row">';
  h += '<label class="sr" for="city">Città</label><select id="city" class="select px" data-city>';
  h += '<option value="">Tutta la Sicilia</option>';
  cityOptions().forEach(function(c){ h += '<option value="'+esc(c.name)+'"'+(ui.city===c.name?' selected':'')+'>'+esc(c.name)+(c.has?'':' (nessun evento)')+'</option>'; });
  h += '</select>';
  h += '<label class="check"><input type="checkbox" data-past'+(ui.past?' checked':'')+'> Mostra eventi passati</label>';
  h += '<span class="spacer"></span>';
  h += '<div class="seg px" role="group" aria-label="Vista"><button type="button" data-view="list" aria-pressed="'+(ui.view==="list")+'">Lista</button><button type="button" data-view="month" aria-pressed="'+(ui.view==="month")+'">Mese</button></div>';

function evCard(e){
  var c = catOf(e), dn = dayNums(e), st = status(e);
  var h = '<button type="button" class="ev px'+(st==="past"?' past':'')+'" data-open="'+esc(e.id)+'" style="--cc:'+c.color+'">';
  h += '<div class="date"><div class="d">'+esc(dn.d1)+'</div>'+(dn.d2?'<div class="d2">'+esc(dn.d2)+'</div>':'')+'<div class="m">'+esc(dn.m)+'</div></div>';
  h += '<div><span class="tag"><i class="sq"></i>'+esc(c.label)+'</span>';
  h += '<h3>'+esc(e.title)+(st==="live"?'<span class="badge">In corso</span>':st==="past"?'<span class="badge past">Concluso</span>':'')+'</h3>';
  if (e.org || e.host) h += '<p class="by">'+byLine(e)+'</p>';
  var w = whereLine(e), tt = timeText(e);
  if (w || tt) h += '<p class="where">'+[w, esc(tt)].filter(Boolean).join(" · ")+'</p>';
  h += '</div></button>';
  return h;
}

function listView(ev){
  if (!ev.length) return emptyState();
  var h = '', cur = '';
  ev.forEach(function(e){
    var s = parse(e.start), key = MONTHS[s.getMonth()]+" "+s.getFullYear();
    if (key !== cur){ h += '<h2 class="month-h">'+esc(key.charAt(0).toUpperCase()+key.slice(1))+'</h2>'; cur = key; }
    h += evCard(e);
  });
  return h;
}
function emptyState(){
  var filtered = ui.cats.length || ui.city;
  return '<div class="empty px"><p>'+(filtered ? 'Nessun evento per questi filtri.' : 'Non ci sono eventi in programma al momento.')+'</p>'+
    (filtered ? '<button class="btn primary px" type="button" data-act="reset">Mostra tutti gli eventi</button>' : (!ui.past ? '<button class="btn px" type="button" data-act="showpast">Guarda gli eventi passati</button>' : ''))+'</div>';
}

function monthView(ev){
  if (!ui.cursor){
    var first = ev.find(function(e){ return status(e) !== "past"; }) || ev[0];
    var base = first ? parse(first.start < today() ? today() : first.start) : new Date();
    ui.cursor = new Date(base.getFullYear(), base.getMonth(), 1);
  }
  var y = ui.cursor.getFullYear(), m = ui.cursor.getMonth();
  var start = new Date(y, m, 1), offset = (start.getDay()+6)%7;
  var gridStart = new Date(y, m, 1-offset);
  var days = new Date(y, m+1, 0).getDate();
  var cells = Math.ceil((offset+days)/7)*7;
  var t = today();
  var h = '<div class="cal-head"><button class="btn small px" type="button" data-month="-1" aria-label="Mese precedente">&lt;</button>';
  h += '<h2>'+esc(MONTHS[m].charAt(0).toUpperCase()+MONTHS[m].slice(1))+' '+y+'</h2>';
  h += '<button class="btn small px" type="button" data-month="1" aria-label="Mese successivo">&gt;</button></div>';
  h += '<div class="grid">';
  DOW.forEach(function(d){ h += '<div class="dow">'+d+'</div>'; });
  for (var i=0;i<cells;i++){
    var d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i), key = ymd(d);
    var inMonth = d.getMonth() === m;
    var todays = ev.filter(function(e){ return e.start <= key && endOf(e) >= key; });
    var cls = 'cell'+(inMonth?'':' out')+(key===t?' today':'')+(ui.selDay===key?' sel':'');
    var label = d.getDate()+' '+MONTHS[d.getMonth()]+(todays.length? ', '+todays.length+(todays.length===1?' evento':' eventi'):'');
    h += '<button type="button" class="'+cls+'" data-day="'+key+'" aria-label="'+esc(label)+'"'+(inMonth?'':' tabindex="-1"')+'><span class="n">'+d.getDate()+'</span>';
    todays.slice(0,2).forEach(function(e){ h += '<span class="bar" style="--cc:'+catOf(e).color+'">'+esc(e.title)+'</span>'; });
    if (todays.length>2) h += '<span class="more">+'+(todays.length-2)+'</span>';
    if (todays.length){ h += '<span class="dots">'; todays.slice(0,4).forEach(function(e){ h += '<i style="--cc:'+catOf(e).color+'"></i>'; }); h += '</span>'; }
    h += '</button>';
  }
  h += '</div>';
  var monthKey = y+"-"+pad(m+1);
  var list;
  if (ui.selDay){
    list = ev.filter(function(e){ return e.start <= ui.selDay && endOf(e) >= ui.selDay; });
    var sd = parse(ui.selDay);
    h += '<div class="day-list"><h2 class="month-h">'+sd.getDate()+' '+MONTHS[sd.getMonth()]+'</h2>';
    h += list.length ? list.map(evCard).join('') : '<div class="empty px"><p>Nessun evento in questo giorno.</p></div>';
  } else {
    list = ev.filter(function(e){ return e.start.slice(0,7) <= monthKey && endOf(e).slice(0,7) >= monthKey; });
    h += '<div class="day-list"><h2 class="month-h">Questo mese</h2>';
    h += list.length ? list.map(evCard).join('') : '<div class="empty px"><p>Nessun evento in questo mese.</p></div>';
  }
  h += '</div>';
  return h;
}

/* ---------- event detail ---------- */
function openEvent(id){
  var e = DATA.events.find(function(x){ return x.id === id; }); if (!e) return;
  var c = catOf(e), past = status(e) === "past";
  var h = '<div class="dlg"><div class="dlg-top"><span class="tag" style="--cc:'+c.color+';display:inline-flex;gap:8px;align-items:center;color:var(--muted)"><i class="sq" style="width:10px;height:10px;background:var(--cc);display:inline-block"></i>'+esc(c.label)+'</span><button class="x" type="button" data-close aria-label="Chiudi">×</button></div>';
  h += '<h2>'+esc(e.title)+'</h2>';
  if (e.org || e.host) h += '<p class="by" style="margin:0">'+byLine(e).replace(/<em>/g,'<b style="color:var(--magenta-ink)">').replace(/<\/em>/g,'</b>')+'</p>';
  h += '<dl class="facts"><dt>Quando</dt><dd>'+esc(rangeText(e))+(timeText(e)?'<br>'+esc(timeText(e)):'')+'</dd>';

    h += '<dt>Dove</dt><dd>'+whereLine(e)+'<br><a href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener">Apri in Mappe</a></dd>';
  }
  if (e.link) h += '<dt>Info</dt><dd><a href="'+esc(e.link)+'" target="_blank" rel="noopener">'+esc(e.link.replace(/^https?:\/\//,'').replace(/\/$/,''))+'</a></dd>';

    h += '<a class="btn primary small px" href="'+esc(gcalUrl(e))+'" target="_blank" rel="noopener">Google Calendar</a>';
    h += '<button class="btn small px" type="button" data-ics="'+esc(e.id)+'">Apple / iPhone (.ics)</button>';
    h += '<a class="btn small px" href="'+esc(outlookUrl(e))+'" target="_blank" rel="noopener">Outlook</a>';
    h += '</div></div>';

var dlgEl = null;
function showDialog(html, onClose){

  dlgEl.className = "px"; dlgEl.style.setProperty("--pc","var(--line-strong)");

  dlgEl.addEventListener("click", function(ev){ if (ev.target === dlgEl) dlgEl.close(); });
  if (dlgEl.showModal) dlgEl.showModal(); else dlgEl.setAttribute("open","");
  var f = dlgEl.querySelector("[autofocus]"); if (f) f.focus();
  return dlgEl;
}
function closeDialog(){ if (dlgEl){ try { dlgEl.close(); } catch(e){ dlgEl.remove(); dlgEl = null; } } }

/* ---------- calendar export ---------- */
function compact(s){ return s.replace(/-/g,""); }
function addDay(s){ var d = parse(s); d.setDate(d.getDate()+1); return ymd(d); }
function hm(t){ return String(t||"").replace(":","")+"00"; }
function calDetails(e){
  return [e.org ? "Powered by "+e.org : "", e.host ? "@ "+e.host : "", e.desc || "", e.link || "", "Dal calendario di AFK Palermo"].filter(Boolean).join("\n");
}
function calLocation(e){ return [e.venue, e.city].filter(Boolean).join(", "); }
function calTitle(e){ return e.title + (e.host ? " @ "+e.host : ""); }
function gcalUrl(e){
  var dates = e.timeStart
    ? compact(e.start)+"T"+hm(e.timeStart)+"/"+compact(endOf(e))+"T"+hm(e.timeEnd || e.timeStart)
    : compact(e.start)+"/"+compact(addDay(endOf(e)));
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(calTitle(e))+"&dates="+dates+"&ctz=Europe%2FRome&details="+encodeURIComponent(calDetails(e))+"&location="+encodeURIComponent(calLocation(e));
}
function outlookUrl(e){
  var s = e.timeStart ? e.start+"T"+e.timeStart+":00" : e.start;
  var en = e.timeStart ? endOf(e)+"T"+(e.timeEnd||e.timeStart)+":00" : addDay(endOf(e));
  return "https://outlook.live.com/calendar/0/deeplink/compose?path=%2Fcalendar%2Faction%2Fcompose&rru=addevent&subject="+encodeURIComponent(calTitle(e))+"&startdt="+encodeURIComponent(s)+"&enddt="+encodeURIComponent(en)+(e.timeStart?"":"&allday=true")+"&location="+encodeURIComponent(calLocation(e))+"&body="+encodeURIComponent(calDetails(e));
}
function icsEsc(s){ return String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;"); }
function icsFor(e){
  var now = new Date(), stamp = now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+"T"+pad(now.getUTCHours())+pad(now.getUTCMinutes())+"00Z";
  var L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//AFK Palermo//Eventi//IT","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "BEGIN:VEVENT","UID:"+e.id+"@afk-palermo","DTSTAMP:"+stamp];
  if (e.timeStart){
    L.push("DTSTART;TZID=Europe/Rome:"+compact(e.start)+"T"+hm(e.timeStart));
    L.push("DTEND;TZID=Europe/Rome:"+compact(endOf(e))+"T"+hm(e.timeEnd||e.timeStart));
  } else {
    L.push("DTSTART;VALUE=DATE:"+compact(e.start));
    L.push("DTEND;VALUE=DATE:"+compact(addDay(endOf(e))));
  }
  L.push("SUMMARY:"+icsEsc(calTitle(e)));
  if (calLocation(e)) L.push("LOCATION:"+icsEsc(calLocation(e)));
  L.push("DESCRIPTION:"+icsEsc(calDetails(e)));
  if (e.link) L.push("URL:"+e.link);
  L.push("END:VEVENT","END:VCALENDAR");
  return L.join("\r\n")+"\r\n";
}
function slug(s){ return String(s||"evento").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48) || "evento"; }
function saveFile(name, data, type){
  if (caps.downloads){
    return caps.downloads.save({filename:name, data:new Blob([data],{type:type})}).catch(function(err){
      if (err && err.code && err.code !== "declined" && err.code !== "cancelled") blobDownload(name, data, type);
    });
  }
  blobDownload(name, data, type);
}
function blobDownload(name, data, type){
  try {
    var url = URL.createObjectURL(new Blob([data],{type:type}));
    var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 2000);
  } catch(e){ toast("Download non riuscito in questa vista. Usa Google Calendar o Outlook."); }
}

/* minimal SHA-256, used only to compare the password without storing it in clear */
function sha256(ascii){
  function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
  var mp = Math.pow, max = mp(2,32), result = "", words = [], bitLen = ascii.length*8, hash = [], k = [], pc = 0, isC = {}, i, j;
  for (var c=2; pc<64; c++){ if (!isC[c]){ for (i=0;i<313;i+=c) isC[i]=c; hash[pc] = (mp(c,.5)*max)|0; k[pc++] = (mp(c,1/3)*max)|0; } }
  hash = hash.slice(0,8);
  ascii += "\x80"; while (ascii.length%64 - 56) ascii += "\x00";
  for (i=0;i<ascii.length;i++){ j = ascii.charCodeAt(i); words[i>>2] |= j << ((3-i)%4)*8; }
  words[words.length] = ((bitLen/max)|0); words[words.length] = bitLen;
  for (j=0;j<words.length;){
    var w = words.slice(j, j+=16), old = hash; hash = hash.slice(0,8);
    for (i=0;i<64;i++){
      var w15 = w[i-15], w2 = w[i-2], a = hash[0], e = hash[4];
      var t1 = hash[7] + (rr(e,6)^rr(e,11)^rr(e,25)) + ((e&hash[5])^((~e)&hash[6])) + k[i] + (w[i] = (i<16) ? w[i] : (w[i-16] + (rr(w15,7)^rr(w15,18)^(w15>>>3)) + w[i-7] + (rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2 = (rr(a,2)^rr(a,13)^rr(a,22)) + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash = [(t1+t2)|0].concat(hash); hash[4] = (hash[4]+t1)|0;
    }
    for (i=0;i<8;i++) hash[i] = (hash[i]+old[i])|0;
  }
  for (i=0;i<8;i++) for (j=3;j+1;j--){ var b = (hash[i]>>(j*8))&255; result += ((b<16)?0:"")+b.toString(16); }
  return result;
}
function utf8(s){ return unescape(encodeURIComponent(s)); }

function askPassword(){
  if (sload("afk-admin") === "1") return enterAdmin();
  var d = showDialog('<div class="dlg"><div class="dlg-top"><h2 style="margin:0">Area organizzatore</h2><button class="x" type="button" data-close aria-label="Chiudi">×</button></div>'+
    '<form class="pw" data-pwform><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" autofocus required>'+
    '<p class="err" data-pwerr hidden style="color:#d1004f;margin:0;font-weight:700">Password sbagliata. Riprova.</p>'+
    '<button class="btn primary px" type="submit">Entra</button></form></div>');
  d.querySelector("[data-pwform]").addEventListener("submit", function(ev){
    ev.preventDefault();
    var v = d.querySelector("#pw").value;
    if (sha256(utf8(v)) === PW_HASH){ sstore("afk-admin","1"); closeDialog(); enterAdmin(); }
    else { d.querySelector("[data-pwerr]").hidden = false; d.querySelector("#pw").select(); }
  });
}
function enterAdmin(){
  var saved = load("afk-draft"), parsed = null;
  try { parsed = saved ? JSON.parse(saved) : null; } catch(e){}
  if (parsed && parsed.base === DATA.updatedAt && Array.isArray(parsed.events)) draft = parsed;
  else { draft = {base: DATA.updatedAt, events: JSON.parse(JSON.stringify(DATA.events)), dirty:false}; store("afk-draft", null); }
  ui.mode = "admin"; render(); window.scrollTo(0,0);
}
function exitAdmin(){ ui.mode = "public"; sstore("afk-admin", null); render(); window.scrollTo(0,0); }
function saveDraft(){ draft.dirty = true; store("afk-draft", JSON.stringify(draft)); }

    h += '<p class="hint">'+(g && g.token ? 'Pubblicazione collegata a GitHub ('+esc(g.owner)+'/'+esc(g.repo)+'). ' : '<b>Prima pubblicazione:</b> serve collegare GitHub una volta su questo dispositivo. ')+'<button class="btn ghost small" type="button" data-act="ghsetup" style="min-height:0;padding:0">'+(g && g.token ? 'Impostazioni GitHub' : 'Collega GitHub')+'</button></p>';

  if (n) h += '<button class="btn small px" type="button" data-act="discard" style="background:transparent;color:inherit;text-decoration:underline">Annulla modifiche</button>';
  if ((caps.artifact && !caps.readOnly) || STANDALONE) h += '<button class="btn lime px" type="button" data-act="publish"'+(n?'':' disabled')+'>Pubblica</button>';
  else h += '<button class="btn lime px" type="button" data-act="export"'+(n?'':' disabled')+'>Scarica il sito aggiornato</button>';
  h += '</span></div></div>';

}
function changesCount(){
  if (!draft) return 0;
  var a = {}, b = {}, n = 0;
  DATA.events.forEach(function(e){ a[e.id] = JSON.stringify(e); });
  draft.events.forEach(function(e){ b[e.id] = JSON.stringify(e); if (a[e.id] !== b[e.id]) n++; });
  Object.keys(a).forEach(function(id){ if (!(id in b)) n++; });
  return n;
}

  if (!id) e.id = "";
  var cats = Object.keys(CATS).map(function(k){ return '<option value="'+k+'"'+(e.category===k?' selected':'')+'>'+esc(CATS[k].label)+'</option>'; }).join("");

  h += '<p class="err full" data-err hidden></p>';
  h += '<div class="full" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary px" type="submit">'+(id?'Salva modifiche':'Aggiungi evento')+'</button><button class="btn px" type="button" data-close>Annulla</button></div>';
  h += '</form></div>';
  var d = showDialog(h);
  d.querySelector("[data-ef]").addEventListener("submit", function(ev){
    ev.preventDefault();
    var f = ev.target, g = function(n){ return (f.elements[n].value||"").trim(); };

    var rec = {id: id || ("e"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)), title:g("title"), org:g("org"), host:g("host"), category:g("category"), city:g("city"), venue:g("venue"), start:g("start"), end:g("end"), timeStart:g("timeStart"), timeEnd:g("timeEnd"), desc:g("desc"), link:g("link")};

    saveDraft(); closeDialog(); render(); toast(id ? "Modifiche salvate. Ricordati di pubblicare." : "Evento aggiunto. Ricordati di pubblicare.");

function buildDocument(data){
  var json = JSON.stringify(data, null, 1).replace(/</g,"\\u003c");
  return "<!doctype html>\n<html lang=\"it\">\n<head>\n"+HEAD_HTML+"\n</head>\n<body>\n<div id=\"app\"></div>\n<script type=\"application/json\" id=\"afk-data\">"+json+"</"+"script>\n"+SCRIPT_HTML+"\n</body>\n</html>\n";
}
function nextData(){
  return {updatedAt: new Date().toISOString(), events: draft.events.slice().sort(sortEv)};
}
function b64(str){ return btoa(unescape(encodeURIComponent(str))); }
function ghCfg(){ try { return JSON.parse(load("afk-gh") || "null"); } catch(e){ return null; } }
function ghDefaults(){
  var owner = location.hostname.split(".")[0] || "";
  var repo = location.pathname.split("/").filter(Boolean)[0] || (owner+".github.io");
  if (/\.html?$/i.test(repo)) repo = owner+".github.io";
  return {owner:owner, repo:repo, branch:"main", token:""};
}
function ghHeaders(token){ return {"Authorization":"Bearer "+token, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"}; }
function ghSetup(thenPublish){
  var c = ghCfg() || ghDefaults();
  var h = '<div class="dlg"><div class="dlg-top"><h2 style="margin:0">Collega GitHub</h2><button class="x" type="button" data-close aria-label="Chiudi">×</button></div>';
  h += '<p>Serve una sola volta per dispositivo: dopo, il tasto Pubblica aggiorna il sito da solo.</p>';
  h += '<ol style="padding-left:1.2em;margin:0 0 14px">';
  h += '<li>Apri <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">questa pagina di GitHub</a>.</li>';
  h += '<li>Nome: <b>AFK eventi</b>. Scadenza: scegli quella più lunga che ti propone.</li>';
  h += '<li>In <b>Repository access</b> scegli <b>Only select repositories</b> e seleziona <b>'+esc(c.repo)+'</b>.</li>';
  h += '<li>In <b>Permissions</b>, alla voce <b>Contents</b>, scegli <b>Read and write</b>.</li>';
  h += '<li>Premi <b>Generate token</b>, copia il codice e incollalo qui sotto.</li></ol>';
  h += '<form class="ef" data-gh novalidate style="grid-template-columns:1fr 1fr">';
  h += '<label class="full">Token GitHub<input name="token" type="password" autocomplete="off" value="'+esc(c.token||"")+'" placeholder="github_pat_…" autofocus></label>';
  h += '<label>Utente GitHub<input name="owner" value="'+esc(c.owner)+'"></label>';
  h += '<label>Repository<input name="repo" value="'+esc(c.repo)+'"></label>';
  h += '<p class="err full" data-err hidden></p>';
  h += '<div class="full" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary px" type="submit">Collega e verifica</button>'+(c.token ? '<button class="btn px" type="button" data-act="ghforget">Scollega questo dispositivo</button>' : '')+'</div>';
  h += '<p class="full" style="margin:0;color:var(--muted);font-size:.9rem">Il token resta salvato solo su questo dispositivo e può modificare solo il repository del sito.</p>';
  h += '</form></div>';
  var d = showDialog(h);
  d.querySelector("[data-gh]").addEventListener("submit", function(ev){
    ev.preventDefault();
    var f = ev.target, err = f.querySelector("[data-err]"), btn = f.querySelector('button[type="submit"]');
    var cfg = {owner:f.elements.owner.value.trim(), repo:f.elements.repo.value.trim(), branch:"main", token:f.elements.token.value.trim()};
    if (!cfg.token){ err.textContent = "Incolla il token generato su GitHub."; err.hidden = false; return; }
    btn.disabled = true; btn.textContent = "Verifico…"; err.hidden = true;
    fetch("https://api.github.com/repos/"+encodeURIComponent(cfg.owner)+"/"+encodeURIComponent(cfg.repo), {headers:ghHeaders(cfg.token), cache:"no-store"})
      .then(function(r){ if (!r.ok) throw r; return r.json(); })
      .then(function(j){
        if (j.permissions && j.permissions.push === false) throw {status:403};
        cfg.branch = j.default_branch || "main"; cfg.owner = j.owner && j.owner.login || cfg.owner; cfg.repo = j.name || cfg.repo;
        store("afk-gh", JSON.stringify(cfg)); closeDialog(); render(); toast("GitHub collegato.");
        if (thenPublish && changesCount()) publish();
      })
      .catch(function(r){
        var st = r && r.status;
        err.textContent = st === 401 ? "Token non valido o scaduto: generane uno nuovo." : st === 404 ? "Repository non trovato: controlla utente e nome, e che il token abbia accesso a questo repository." : st === 403 ? "Il token non ha il permesso Contents: Read and write." : "Connessione a GitHub non riuscita. Riprova.";
        err.hidden = false; btn.disabled = false; btn.textContent = "Collega e verifica";
      });
  });
}
function ghPublish(){
  var cfg = ghCfg(); if (!cfg || !cfg.token) return ghSetup(true);
  var btn = app.querySelector('[data-act="publish"]'); if (btn){ btn.disabled = true; btn.textContent = "Pubblico…"; }
  var data = nextData(), body = JSON.stringify(data, null, 1)+"\n";
  var api = "https://api.github.com/repos/"+encodeURIComponent(cfg.owner)+"/"+encodeURIComponent(cfg.repo)+"/contents/events.json";
  var H = ghHeaders(cfg.token);
  fetch(api+"?ref="+encodeURIComponent(cfg.branch)+"&t="+Date.now(), {headers:H, cache:"no-store"})
    .then(function(r){ if (r.status === 404) return null; if (!r.ok) throw r; return r.json(); })
    .then(function(cur){
      var payload = {message:"Aggiorna eventi AFK", content:b64(body), branch:cfg.branch};
      if (cur && cur.sha) payload.sha = cur.sha;
      return fetch(api, {method:"PUT", headers:H, body:JSON.stringify(payload)});
    })
    .then(function(r){
      if (!r.ok) throw r;
      DATA = data;
      draft = {base: DATA.updatedAt, events: JSON.parse(JSON.stringify(DATA.events)), dirty:false};
      store("afk-draft", null); render();
      toast("Pubblicato. Il sito si aggiorna per tutti entro un paio di minuti.");
    })
    .catch(function(r){
      var st = r && r.status;
      if (st === 401){ toast("Il token GitHub non è più valido: collegalo di nuovo."); ghSetup(true); }
      else if (st === 403 || st === 404){ toast("Il token non può scrivere su questo repository. Controlla le impostazioni."); ghSetup(true); }
      else if (st === 409){ toast("Il file era cambiato nel frattempo: premi di nuovo Pubblica."); }
      else toast("Pubblicazione non riuscita. Le modifiche sono salve: riprova tra poco.");
      if (btn){ btn.disabled = false; btn.textContent = "Pubblica"; }
    });
}
function publish(){
  if (!caps.artifact){ if (STANDALONE) ghPublish(); return; }
  var btn = app.querySelector('[data-act="publish"]'); if (btn){ btn.disabled = true; btn.textContent = "Pubblico…"; }
  sstore("afk-admin","1");
  caps.artifact.publish(buildDocument(nextData())).then(function(){
    store("afk-draft", null); toast("Pubblicato. Il calendario è aggiornato.");
  }).catch(function(err){
    var code = err && err.code;
    if (code === "conflict"){ toast("Il calendario era cambiato: lo sto ricaricando."); return; }
    if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "capability_disabled" || code === "not_declared"){
      caps.readOnly = true; render(); toast("Questa vista è di sola lettura: aprila dal tuo account per pubblicare."); return;
    }
    if (code === "rate_limited"){ toast("Troppe pubblicazioni ravvicinate. Riprova tra un minuto."); }
    else toast("Pubblicazione non riuscita. Le modifiche sono salve: riprova tra poco.");
    if (btn){ btn.disabled = false; btn.textContent = "Pubblica"; }
  });
}
function exportSite(){
  saveFile("index.html", buildDocument(nextData()), "text/html");
  toast("File scaricato: caricalo al posto del vecchio index.html.");
}

/* ---------- events ---------- */
app.addEventListener("click", function(ev){
  var el = ev.target.closest("button, a"); if (!el || !app.contains(el)) return;
  var d = el.dataset;
  if ("close" in d){ closeDialog(); return; }
  if (d.open){ openEvent(d.open); return; }
  if (d.ics){ var e = DATA.events.find(function(x){ return x.id === d.ics; }); if (e) saveFile("afk-"+slug(e.title)+".ics", icsFor(e), "text/calendar"); return; }
  if (d.cat !== undefined && el.classList.contains("chip")){
    if (!d.cat) ui.cats = [];
    else { var i = ui.cats.indexOf(d.cat); if (i<0) ui.cats.push(d.cat); else ui.cats.splice(i,1); if (ui.cats.length === Object.keys(CATS).length) ui.cats = []; }
    ui.selDay = null; render(); return;
  }
  if (d.view){ ui.view = d.view; ui.selDay = null; render(); return; }
  if (d.month){ ui.cursor = new Date(ui.cursor.getFullYear(), ui.cursor.getMonth()+(+d.month), 1); ui.selDay = null; render(); return; }
  if (d.day){ if (el.classList.contains("out")) return; ui.selDay = ui.selDay === d.day ? null : d.day; render(); var dl = app.querySelector(".day-list"); if (dl && window.innerWidth < 700) dl.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if (d.edit){ editForm(d.edit); return; }
  if (d.dup){ var src = draft.events.find(function(x){ return x.id === d.dup; }); if (src){ var c = JSON.parse(JSON.stringify(src)); c.title = c.title; editForm(null, c); } return; }
  if (d.del){
    var t = draft.events.find(function(x){ return x.id === d.del; });
    if (t && confirm("Eliminare \u201c"+t.title+"\u201d?")){ draft.events = draft.events.filter(function(x){ return x.id !== d.del; }); saveDraft(); render(); toast("Evento eliminato. Ricordati di pubblicare."); }
    return;
  }
  switch (d.act){
    case "install": install(); break;
    case "admin": ev.preventDefault(); askPassword(); break;
    case "exit": ev.preventDefault(); exitAdmin(); break;
    case "new": editForm(null); break;
    case "publish": publish(); break;
    case "export": exportSite(); break;
    case "ghsetup": ghSetup(false); break;
    case "ghforget": if (confirm("Scollegare GitHub da questo dispositivo?")){ store("afk-gh", null); closeDialog(); render(); toast("GitHub scollegato da questo dispositivo."); } break;
    case "discard": if (confirm("Annullare tutte le modifiche non pubblicate?")){ draft = {base: DATA.updatedAt, events: JSON.parse(JSON.stringify(DATA.events)), dirty:false}; store("afk-draft", null); render(); } break;
    case "reset": ui.cats = []; ui.city = ""; render(); break;
    case "showpast": ui.past = true; render(); break;
  }
  if (el.getAttribute("href") === "#") ev.preventDefault();
});
app.addEventListener("change", function(ev){
  var t = ev.target;
  if (t.hasAttribute("data-city")){ ui.city = t.value; ui.selDay = null; render(); var s = app.querySelector("[data-city]"); if (s) s.focus(); }
  if (t.hasAttribute("data-past")){ ui.past = t.checked; render(); var c = app.querySelector("[data-past]"); if (c) c.focus(); }
});
window.addEventListener("hashchange", function(){ if (location.hash === "#admin") askPassword(); });

/* ---------- boot ---------- */
function boot(){
  render();
  if (sload("afk-admin") === "1") enterAdmin();
  else if (location.hash === "#admin") askPassword();
}
if (STANDALONE){
  render();
  fetch("events.json?t="+Date.now(), {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ if (j && Array.isArray(j.events)) DATA = j; })
    .catch(function(){})
    .then(boot);
} else boot();

function hookClaude(tries){
  if (!(window.claude && typeof window.claude.use === "function")){ if (tries < 30) setTimeout(function(){ hookClaude(tries+1); }, 200); return; }
  window.claude.use("artifact").then(function(a){ caps.artifact = a; if (ui.mode === "admin") render(); }).catch(function(){});
  window.claude.use("downloads").then(function(d){ caps.downloads = d; }).catch(function(){});
  window.claude.use("user").then(function(u){
    if (!u) return;
    return u.isOwner().then(function(o){ caps.owner = !!o; });
  }).catch(function(){});
}
hookClaude(0);
/* offline support when hosted as a standalone site (GitHub Pages, Netlify…) */
if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude\.(ai|site)|claudeusercontent/.test(location.hostname)){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
})();
</script>
